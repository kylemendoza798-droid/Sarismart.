<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SariSmart — Printable QR Labels</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --maroon:#7A1E2B; --gold:#D9A441; --cream:#FBF6EC; }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', system-ui, sans-serif;
    background:var(--cream);
    margin:0;
    padding:24px;
    color:#2B1E14;
  }
  .toolbar{
    max-width:640px;
    margin:0 auto 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .toolbar h1{font-size:1.2rem;margin:0;color:var(--maroon);}
  .toolbar button{
    background:var(--maroon);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
  }
  .sheet{
    max-width:640px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .label{
    background:#fff;
    border:2px dashed var(--gold);
    border-radius:10px;
    padding:14px;
    text-align:center;
  }
  .label .qr{display:flex;justify-content:center;margin-bottom:8px;}
  .label .name{font-weight:700;font-size:.9rem;color:var(--maroon);}
  .label .code{font-size:.7rem;color:#8a7860;margin-top:2px;}
  .note{max-width:640px;margin:20px auto 0;font-size:.8rem;color:#6b5a44;text-align:center;}
  @media print{
    .toolbar{display:none;}
    body{padding:0;background:#fff;}
    .label{border:1px solid #ccc;break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="logo.png" alt="SariSmart logo" style="height:36px;width:36px;object-fit:contain;">
    <h1>SariSmart — QR Labels to Print</h1>
  </div>
  <button onclick="window.print()">Print</button>
</div>

<div class="sheet" id="sheet"></div>
<p class="note">Cut out each label and stick it on the matching product. Codes match the sample products already loaded in the SariSmart app — scan them straight away to test Inventory (Stock) and Sale (Benta) entries.</p>

<script>
const products = [
  { code: 'SARISMART-P001', name: 'Nescafe 3in1' },
  { code: 'SARISMART-P002', name: 'Kopiko Blanca' },
  { code: 'SARISMART-P003', name: 'Lucky Me Pancit Canton' },
  { code: 'SARISMART-P004', name: 'Coke 1L' },
  { code: 'SARISMART-P005', name: 'Purefoods Corned Beef' }
];

const sheet = document.getElementById('sheet');
products.forEach(p=>{
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<div class="qr" id="qr-${p.code}"></div>
    <div class="name">${p.name}</div>
    <div class="code">${p.code}</div>`;
  sheet.appendChild(label);
  new QRCode(document.getElementById('qr-'+p.code), {
    text: p.code, width: 130, height: 130, colorDark:'#7A1E2B', colorLight:'#ffffff'
  });
});
</script>
</body>
</html>
