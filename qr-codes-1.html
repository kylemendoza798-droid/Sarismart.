<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SariSmart — Printable Barcode Labels</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  :root{ --maroon:#7A1E2B; --gold:#D9A441; --cream:#FBF6EC; }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', system-ui, sans-serif;
    background:var(--cream);
    margin:0;
    padding:24px;
    color:#2B1E14;
  }
  .toolbar{
    max-width:800px;
    margin:0 auto 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .toolbar h1{font-size:1.2rem;margin:0;color:var(--maroon);}
  .toolbar button{
    background:var(--maroon);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
  }
  .sheet{
    max-width:800px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .label{
    background:#fff;
    border:1px dashed var(--gold);
    border-radius:6px;
    padding:8px;
    text-align:center;
    page-break-inside: avoid;
  }
  .label svg {
    max-width: 100%;
    height: auto;
  }
  .label .name{font-weight:700;font-size:.75rem;color:var(--maroon);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .label .code{font-size:.65rem;color:#8a7860;}
  .note{max-width:800px;margin:20px auto 0;font-size:.8rem;color:#6b5a44;text-align:center;}
  @media print{
    .toolbar{display:none;}
    body{padding:0;background:#fff;}
    .sheet{grid-template-columns:repeat(4, 1fr);gap:5px;}
    .label{border:1px solid #eee;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="logo.png" alt="SariSmart logo" style="height:36px;width:36px;object-fit:contain;">
    <h1>SariSmart — Printable Barcode Labels</h1>
  </div>
  <button onclick="window.print()">Print</button>
</div>

<div class="sheet" id="sheet"></div>
<p class="note">Cut out each label and stick it on the matching product. Scan them in the app to manage stock.</p>

    <div class="name">${p.name}</div>

  sheet.appendChild(label);
  
  // Generate Barcode
  JsBarcode(`#barcode-${p.code}`, p.code, {
    format: "CODE128",
